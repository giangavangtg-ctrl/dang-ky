<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản dịch vụ</title>
    
    <!-- Cài đặt Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Cài đặt Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <!-- Khối Card chứa toàn bộ giao diện, dùng shadow để đổ bóng -->
        <div class="card shadow-lg border-0 overflow-hidden mx-auto" style="max-width: 1000px;">
            <div class="row g-0">
                
                <!-- BÊN TRÁI: CAROUSEL GIỚI THIỆU LỢI ÍCH -->
                <!-- Trên màn hình nhỏ (mobile) phần này sẽ nằm trên, màn hình vừa (md) trở lên sẽ chia nửa (col-md-6) -->
                <div class="col-md-6 d-none d-md-block bg-dark">
                    <div id="benefitsCarousel" class="carousel slide h-100" data-bs-ride="carousel">
                        <!-- Chỉ báo slide (Indicators) -->
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#benefitsCarousel" data-bs-slide-to="0" class="active"></button>
                            <button type="button" data-bs-target="#benefitsCarousel" data-bs-slide-to="1"></button>
                            <button type="button" data-bs-target="#benefitsCarousel" data-bs-slide-to="2"></button>
                        </div>
                        
                        <div class="carousel-inner h-100">
                            <!-- Slide 1 -->
                            <div class="carousel-item active h-100">
                                <img src="https://via.placeholder.com/600x800/0d6efd/ffffff?text=Nhanh+Chong" class="d-block w-100 h-100 object-fit-cover" alt="Nhanh chóng">
                                <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3 mb-4">
                                    <h4 class="fw-bold"><i class="fas fa-rocket text-warning"></i> Nhanh Chóng & Tiện Lợi</h4>
                                    <p>Trải nghiệm dịch vụ với tốc độ vượt trội, tiết kiệm tối đa thời gian của bạn.</p>
                                </div>
                            </div>
                            <!-- Slide 2 -->
                            <div class="carousel-item h-100">
                                <img src="https://via.placeholder.com/600x800/198754/ffffff?text=Bao+Mat" class="d-block w-100 h-100 object-fit-cover" alt="Bảo mật">
                                <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3 mb-4">
                                    <h4 class="fw-bold"><i class="fas fa-shield-alt text-warning"></i> Bảo Mật Tuyệt Đối</h4>
                                    <p>Thông tin của bạn được mã hóa và bảo vệ với tiêu chuẩn an ninh cao nhất.</p>
                                </div>
                            </div>
                            <!-- Slide 3 -->
                            <div class="carousel-item h-100">
                                <img src="https://via.placeholder.com/600x800/dc3545/ffffff?text=Ho+Tro" class="d-block w-100 h-100 object-fit-cover" alt="Hỗ trợ 24/7">
                                <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3 mb-4">
                                    <h4 class="fw-bold"><i class="fas fa-headset text-warning"></i> Hỗ Trợ 24/7</h4>
                                    <p>Đội ngũ chuyên viên luôn sẵn sàng giải đáp mọi thắc mắc của bạn bất cứ lúc nào.</p
